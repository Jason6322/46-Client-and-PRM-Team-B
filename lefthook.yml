pre-commit:
  commands:
    validate-placeholders:
      run: node scripts/validate-placeholders.js

    format:
      # {,**/} so root-level files (README.md, package.json) match too —
      # a bare **/ requires at least one directory and silently skips them.
      glob: '{,**/}*.{ts,tsx,json,md,css}'
      exclude: '(node_modules|\.next|\.git)'
      run: pnpm exec prettier --write {staged_files} && git add {staged_files}

    lint-frontend:
      root: 'frontend/'
      glob: 'frontend/src/**/*.{ts,tsx}'
      run: pnpm exec eslint --fix {staged_files} && git add {staged_files}

    lint-backend:
      root: 'backend/'
      glob: 'backend/src/**/*.ts'
      run: pnpm exec eslint --fix {staged_files} && git add {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: node scripts/check-commit-msg.js {1}
