packages:
  - 'frontend'
  - 'backend'

overrides:
  # firebase-functions pulls in @types/express@4 transitively, which conflicts
  # with our own @types/express@^5 (backend uses Express 5) and causes
  # environment-dependent type errors depending on how pnpm hoists the two
  # versions. Force one version everywhere.
  '@types/express': '^5.0.1'
  # next@16.3.5 still bundles its own old postcss internally (separate from
  # the patched one Tailwind/Vite already use) — force it to a patched
  # version too. postcss 8.x is backward-compatible within the major.
  postcss: '^8.5.18'
  # next also bundles an old sharp (image optimization) — force the patched line.
  # GHSA-rgj7-g3m4-5g8c: libheif vulns reachable via sharp <0.35.4.
  sharp: '^0.35.4'
  # Both transitive and build/lint-time only, but they fail the CI security
  # gate (`pnpm audit --audit-level=high`), so they are patched here.
  # js-yaml (GHSA-2883-xcg3-v3hh): maxTotalMergeKeys does not limit CPU use for
  # empty merge sources - unbounded CPU DoS. Patched in 4.3.2. Reached via eslint.
  'js-yaml': '^4.3.2'
  # nanoid (GHSA-2v37-7h3g-55p8): infinite loop when a custom generator's
  # size is 0, via postcss. Advisory lists <3.3.18 as vulnerable.
  nanoid: '^3.3.18'

allowBuilds:
  '@firebase/util': true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
